<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Visitas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #0f0f0f;
      color: #fff;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    #scanner {
      width: 100%;
      max-width: 500px;
      border: 2px solid #333;
      border-radius: 10px;
      overflow: hidden;
    }

    video {
      width: 100%;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #1f6fff;
      color: white;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid #333;
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }

    .ok {
      color: #00ff9d;
    }

    .muted {
      color: #888;
    }
  </style>
</head>
<body>

  <h1>Registro de Visitas (Escáner)</h1>

  <div id="scanner"></div>
  <button onclick="startScanner()">Iniciar Cámara</button>
  <button onclick="stopScanner()">Detener</button>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Hora</th>
      </tr>
    </thead>
    <tbody id="log"></tbody>
  </table>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <script>
    let codeReader;
    let selectedDeviceId;

    const logTable = document.getElementById('log');

    function addLog(code) {
      const now = new Date().toLocaleString();
      const row = document.createElement('tr');
      row.innerHTML = `<td class='ok'>${code}</td><td class='muted'>${now}</td>`;
      logTable.prepend(row);

      let data = JSON.parse(localStorage.getItem('visitas') || '[]');
      data.push({ code, time: now });
      localStorage.setItem('visitas', JSON.stringify(data));
    }

    function loadLogs() {
      let data = JSON.parse(localStorage.getItem('visitas') || '[]');
      data.reverse().forEach(v => {
        const row = document.createElement('tr');
        row.innerHTML = `<td class='ok'>${v.code}</td><td class='muted'>${v.time}</td>`;
        logTable.appendChild(row);
      });
    }

    function startScanner() {
      codeReader = new ZXing.BrowserMultiFormatReader();

      codeReader.getVideoInputDevices()
        .then((videoInputDevices) => {
          selectedDeviceId = videoInputDevices[0].deviceId;

          codeReader.decodeFromVideoDevice(selectedDeviceId, 'scanner', (result, err) => {
            if (result) {
              addLog(result.text);
            }
          });
        })
        .catch(err => console.error(err));
    }

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
      }
    }

    loadLogs();
  </script>

</body>
</html>
